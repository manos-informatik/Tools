<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Klassentafel</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <svg class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-fullscreen" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol>
    <symbol id="icon-exit-fullscreen" viewBox="0 0 24 24"><path d="M3 8h5V3m8 0v5h5M8 21v-5H3m13 5v-5h5"/></symbol>
    <symbol id="icon-play" viewBox="0 0 24 24"><path d="m9 5 11 7-11 7Z"/></symbol>
    <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="icon-reset" viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></symbol>
    <symbol id="icon-person" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3.5"/><path d="M5 21v-3a7 7 0 0 1 14 0v3"/></symbol>
    <symbol id="icon-pair" viewBox="0 0 32 24"><circle cx="9" cy="7" r="3.5"/><circle cx="23" cy="7" r="3.5"/><path d="M2 21v-3a7 7 0 0 1 14 0v3m0-3a7 7 0 0 1 14 0v3"/></symbol>
    <symbol id="icon-group" viewBox="0 0 40 24"><circle cx="20" cy="7" r="3.5"/><circle cx="6" cy="8" r="3"/><circle cx="34" cy="8" r="3"/><path d="M13 21v-3a7 7 0 0 1 14 0v3M1 21v-3a5 5 0 0 1 9-3m29 6v-3a5 5 0 0 0-9-3"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  </svg>

  <header class="topbar">
    <h1 class="sr-only">Klassentafel</h1>
    <div class="clock" aria-label="Uhrzeit und Datum">
      <time id="clockTime" class="clock-time" aria-label="Uhrzeit">00:00</time>
      <span class="clock-divider" aria-hidden="true"></span>
      <time id="clockDate" class="clock-date"></time>
    </div>
    <div class="topbar-actions">
      <button id="resetButton" class="button icon-button fullscreen-button" type="button" aria-label="Seite zurücksetzen" title="Seite zurücksetzen">
        <svg aria-hidden="true"><use href="#icon-reset"/></svg>
      </button>
      <button id="fullscreenButton" class="button icon-button fullscreen-button" type="button" aria-label="Vollbild anzeigen" title="Vollbild anzeigen" aria-pressed="false">
        <svg aria-hidden="true"><use id="fullscreenIcon" href="#icon-fullscreen"/></svg>
      </button>
    </div>
  </header>

  <main class="board">
    <section class="panel task-panel" aria-labelledby="taskHeading">
      <div class="panel-heading">
        <div class="task-heading-main">
          <h2 id="taskHeading">Aufgabenstellung</h2>
          <div id="taskSwitcher" class="task-switcher" role="group" aria-label="Aufgabe auswählen">
            <button class="task-number" type="button" data-task="0" aria-label="Aufgabe 1" aria-pressed="true">1</button>
            <button id="addTask" class="task-number task-add" type="button" aria-label="Aufgabe hinzufügen" title="Aufgabe hinzufügen">+</button>
          </div>
        </div>
        <button id="clearTask" class="button icon-button quiet-button" type="button" aria-label="Aufgabenstellung leeren" title="Aufgabenstellung leeren" hidden>
          <svg aria-hidden="true"><use href="#icon-trash"/></svg>
        </button>
      </div>
      <textarea id="taskInput" aria-labelledby="taskHeading" spellcheck="false"></textarea>
    </section>

    <section id="timerPanel" class="panel timer-panel" aria-labelledby="timerHeading">
      <div class="panel-heading">
        <h2 id="timerHeading">Zeit</h2>
        <span id="timerIndicator" class="timer-indicator" aria-hidden="true"></span>
      </div>
      <div class="timer-body">
        <div class="timer-face">
          <div id="timerEditor" class="timer-editor">
            <input id="minutesInput" type="number" min="0" max="999" step="1" placeholder="00" aria-label="Minuten" inputmode="numeric" autocomplete="off">
            <span class="timer-colon" aria-hidden="true">:</span>
            <input id="secondsInput" type="number" min="0" max="59" step="1" placeholder="00" aria-label="Sekunden" inputmode="numeric" autocomplete="off">
          </div>
          <output id="timerDisplay" class="timer-display" role="timer" aria-label="Verbleibende Zeit" aria-live="off" hidden>00:00</output>
        </div>
        <div id="timerProgress" class="timer-progress" role="progressbar" aria-label="Verbleibende Zeit" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span id="timerProgressFill"></span>
        </div>
        <div class="timer-presets" aria-label="Timer-Voreinstellungen">
          <button type="button" class="preset-button" data-minutes="5">5 Min.</button>
          <button type="button" class="preset-button" data-minutes="10">10 Min.</button>
          <button type="button" class="preset-button" data-minutes="15">15 Min.</button>
          <button type="button" class="preset-button" data-minutes="20">20 Min.</button>
        </div>
        <div class="timer-actions">
          <button id="timerToggle" class="button primary-button" type="button">
            <svg aria-hidden="true"><use id="timerToggleIcon" href="#icon-play"/></svg>
            <span id="timerToggleLabel">Start</span>
          </button>
          <button id="timerReset" class="button icon-button" type="button" aria-label="Timer zurücksetzen" title="Timer zurücksetzen">
            <svg aria-hidden="true"><use href="#icon-reset"/></svg>
          </button>
        </div>
      </div>
    </section>

    <section class="panel social-panel" aria-labelledby="socialHeading">
      <div class="panel-heading"><h2 id="socialHeading">Sozialform</h2></div>
      <div class="social-options" role="radiogroup" aria-labelledby="socialHeading">
        <label class="social-option">
          <input type="radio" name="social" value="single" checked>
          <svg class="social-icon" aria-hidden="true"><use href="#icon-person"/></svg>
          <span>Einzelarbeit</span>
          <svg class="selection-check" aria-hidden="true"><use href="#icon-check"/></svg>
        </label>
        <label class="social-option">
          <input type="radio" name="social" value="pair">
          <svg class="social-icon" aria-hidden="true"><use href="#icon-pair"/></svg>
          <span>Paararbeit</span>
          <svg class="selection-check" aria-hidden="true"><use href="#icon-check"/></svg>
        </label>
        <label class="social-option">
          <input type="radio" name="social" value="group">
          <svg class="social-icon" aria-hidden="true"><use href="#icon-group"/></svg>
          <span>Gruppenarbeit</span>
          <svg class="selection-check" aria-hidden="true"><use href="#icon-check"/></svg>
        </label>
      </div>
    </section>
  </main>
  <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
</body>
</html>
